[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-ballchasing"
dynamic = ["version"]
# authors = [
#     { name = "ballchasing", email = "email@example.com" }  # Update from __author__ and __email__
# ]
description = "A Python wrapper for the ballchasing API"  # Update from __description__
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.7",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiofiles",
    "aiohttp",
    "pydantic",
    "aiolimiter",
]

[project.urls]
Homepage = "https://github.com/xentrick/python-ballchasing"  # Update from __url__
Download = "https://github.com/xentrick/python-ballchasing"  # Update from __download_url__

[tool.setuptools.dynamic]
version = { attr = "ballchasing.__version__" }

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
ballchasing = ["*.tsv"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplify
    "TRY",    # exception handling
    "RUF",    # ruff-specific
    "PIE",    # misc lints
    "DTZ",    # naive datetimes
    "ASYNC",  # async correctness
]
ignore = [
    # The formatter owns line breaks; long URLs and docstrings in the API
    # reference would otherwise need awkward manual wrapping.
    "E501",
    # Ballchasing returns useful error payloads that belong in the message.
    "TRY003",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/"]
# Only real test modules; payloads.py and conftest.py are helpers.
python_files = ["test_*.py"]
# No env_files: the suite runs entirely against a loopback server and must
# never pick up a production ballchasing key.

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.21.2",
    "pytest-dotenv>=0.5.2",
    "ty>=0.0.45",
]
